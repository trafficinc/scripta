[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
scr-ast = { path = "crates/scr-ast" }
scr-diagnostics = { path = "crates/scr-diagnostics" }
scr-lexer = { path = "crates/scr-lexer" }
scr-parser = { path = "crates/scr-parser" }
scr-runtime = { path = "crates/scr-runtime" }
scr-stdlib = { path = "crates/scr-stdlib" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Retain unwinding for process/resource cleanup and checked host arithmetic.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
incremental = false
overflow-checks = true
panic = "unwind"

[profile.dist]
inherits = "release"
strip = "symbols"
debug = 0
