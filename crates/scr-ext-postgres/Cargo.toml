[package]
name = "scr-ext-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scr-db = { path = "../scr-db" }
scr-runtime.workspace = true
scr-stdlib.workspace = true
# Protocol codecs and SCRAM authentication; crypto is not implemented here.
postgres-protocol = "=0.6.10"
bytes = "1"
fallible-iterator = "0.2"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
tempfile = "3.15"

[lints]
workspace = true
