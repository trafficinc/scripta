[package]
name = "scr-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
multer = { version = "3.1", default-features = false, features = ["tokio-io"] }
mime = "0.3"
tempfile = "3.15"
scr-runtime.workspace = true
scr-stdlib.workspace = true
scr-ast.workspace = true
scr-lexer.workspace = true
scr-parser.workspace = true
hyper = { version = "1.6", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio = { version = "1.44", features = ["rt-multi-thread", "net", "time", "sync", "process", "io-util", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
