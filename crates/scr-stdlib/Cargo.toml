[package]
name = "scr-stdlib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
ring = "0.17.14"
subtle = { version = "2.6.1", default-features = false }
mio = { version = "1.0", features = ["net", "os-poll"] }
socket2 = { version = "0.6", features = ["all"] }
scr-runtime.workspace = true
process-wrap = { version = "8.2.2", features = ["std"] }
tempfile = "3.15"
same-file = "=1.0.6"
sysinfo = { version = "0.33.1", default-features = false, features = ["system"] }

chrono = { version = "0.4.39", default-features = false, features = ["std"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-bundle-always"] }
fs2 = "0.4.3"
getrandom = "0.3.4"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash", "zeroize"] }
zeroize = { version = "1.8", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }
url = "=2.5.9"

rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

regex = "1.11"
csv = "1.3"
unicode-segmentation = "=1.12.0"

[dev-dependencies]
rcgen = "0.13"
scr-lexer.workspace = true
scr-parser.workspace = true

[lints]
workspace = true

[[bench]]
name = "collections"
harness = false
