[package]
name = "scr-ext-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
scr-db = { path = "../scr-db" }
scr-runtime.workspace = true
scr-stdlib.workspace = true
tempfile = "3.15"
# 28.x's mysql_common uses integer APIs unavailable on Rust 1.85.
mysql = { version = "26.0.1", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
# Validate the client's placeholder parser against normalized SQL before prepare.
mysql_common = { version = "0.35.5", default-features = false }

[lints]
workspace = true
