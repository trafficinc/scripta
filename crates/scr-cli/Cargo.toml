[package]
name = "scr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "scripta"

[dependencies]
scr-ext-sqlite = { path = "../scr-ext-sqlite", optional = true }
scr-diagnostics.workspace = true
scr-ast.workspace = true
tempfile = "3.15"
scr-lexer.workspace = true
scr-parser.workspace = true
scr-runtime.workspace = true
scr-stdlib.workspace = true
ctrlc = { version = "3.4", features = ["termination"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
semver = "1"
sha2 = "0.10"

[features]
default = ["sqlite"]
sqlite = ["dep:scr-ext-sqlite"]

[[bin]]
name = "scripta"
path = "src/main.rs"

[[bin]]
name = "scr"
path = "src/bin/scr.rs"

[dev-dependencies]
proptest = { version = "1.6", default-features = false, features = ["std"] }

[[bench]]
name = "interpreter"
harness = false

[lints]
workspace = true
