name: Promote validated release

on:
  workflow_dispatch:
    inputs:
      validation_tag:
        description: Published validation tag whose packages passed native checks
        required: true
        type: string
      validation_run_id:
        description: Successful Native builds and releases run ID for that tag
        required: true
        type: string
      release_tag:
        description: Stable tag matching the validated workspace version (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-promotion-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Verify and promote unchanged packages
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: scripta-release-publication
      cancel-in-progress: false
    steps:
      - name: Check out promotion tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test promotion and publication tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify validated assets, create stable tag, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATION_TAG: ${{ inputs.validation_tag }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: >-
          python3 scripts/promote_release.py
          --validation-tag "$VALIDATION_TAG"
          --validation-run-id "$VALIDATION_RUN_ID"
          --release-tag "$RELEASE_TAG"
          --output dist/promoted-release
          --publish

      - name: Retain prepared promotion evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-promotion-${{ github.run_id }}
          path: dist/promoted-release*
          if-no-files-found: ignore
          retention-days: 7
