name: Build release candidate
run-name: Build release candidate from ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python: python
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check candidate version is available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: ${{ matrix.python }} scripts/workflow_build.py inspect

      - name: Validate native tests and packages
        shell: bash
        run: >-
          ${{ matrix.python }} scripts/validate_native.py
          --target "${{ matrix.target }}"
          --output "dist/native-validation/${{ matrix.target }}"

      - name: Save test logs, packages, and native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-validation-${{ matrix.target }}
          overwrite: true
          path: dist/native-validation/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  assemble:
    name: Assemble validated downloads
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out selected packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download successful native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-validation-*
          path: dist/release-inputs
          merge-multiple: false

      - name: Verify all four platforms and assemble downloads
        run: >-
          python3 scripts/workflow_build.py prepare
          --inputs dist/release-inputs
          --output dist/release-assets

      - name: Save the validated build
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scripta-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show build downloads
        env:
          BUILD_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python3 scripts/workflow_build.py summary
