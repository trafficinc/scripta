name: Native builds and releases
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.request_id && format('Pre-release validation {0}', inputs.request_id) || format('Build {0}', github.ref_name)) || format('Release {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release after all four platforms pass
        required: true
        default: false
        type: boolean
      release_tag:
        description: Optional tag (blank uses v<workspace-version>; RC/validation tags are prereleases)
        required: false
        type: string
      notes:
        description: Optional release notes (used only when Create release is checked)
        required: false
        type: string
      request_id:
        description: Optional identifier for scripts/github_release.py; leave blank in the UI
        required: false
        type: string
      expected_revision:
        description: Optional full commit SHA assertion for the release helper; leave blank in the UI
        required: false
        type: string
  push:
    tags:
      - '**'

permissions:
  contents: read

env:
  BUILD_CREATE_RELEASE: ${{ inputs.create_release && 'true' || 'false' }}
  BUILD_RELEASE_TAG: ${{ inputs.release_tag }}
  BUILD_RELEASE_NOTES: ${{ inputs.notes }}
  BUILD_EXPECTED_REVISION: ${{ inputs.expected_revision }}

concurrency:
  group: native-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python: python3
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            python: python3
          - os: macos-15
            target: aarch64-apple-darwin
            python: python3
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python: python
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check build version, tag, and selected revision
        shell: bash
        run: ${{ matrix.python }} scripts/workflow_build.py inspect

      - name: Validate native tests and packages
        shell: bash
        run: >-
          ${{ matrix.python }} scripts/validate_native.py
          --target "${{ matrix.target }}"
          --output "dist/native-validation/${{ matrix.target }}"

      - name: Save test logs, packages, and native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-validation-${{ matrix.target }}
          overwrite: true
          path: dist/native-validation/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

  assemble:
    name: Assemble validated downloads
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out selected packaging tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download successful native packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-validation-*
          path: dist/release-inputs
          merge-multiple: false

      - name: Verify all four platforms and assemble downloads
        run: >-
          python3 scripts/workflow_build.py prepare
          --inputs dist/release-inputs
          --output dist/release-assets

      - name: Save the validated build
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scripta-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show build downloads
        env:
          BUILD_ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: python3 scripts/workflow_build.py summary

  publish:
    name: Publish release downloads
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [validate, assemble]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: scripta-release-publication
      cancel-in-progress: false
    steps:
      - name: Check out selected publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download this run's validated build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.assemble.outputs.artifact_id }}
          path: dist/release-assets
          merge-multiple: true

      - name: Verify saved assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/workflow_build.py publish
          --assets dist/release-assets
