name: Publish successful build
run-name: Publish saved build as ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New release tag matching the built version (for example v0.1.2)
        required: true
        type: string
      build_run_id:
        description: Optional native build run ID; blank selects the latest successful build on main
        required: false
        type: string
      notes:
        description: Optional release notes
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Verify and publish saved build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    concurrency:
      group: scripta-release-publication
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      SAVED_BUILD_RUN_ID: ${{ inputs.build_run_id }}
      SAVED_BUILD_RELEASE_TAG: ${{ inputs.release_tag }}
      SAVED_BUILD_NOTES: ${{ inputs.notes }}
    steps:
      - name: Check out publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Select and verify successful build
        id: build
        run: python3 scripts/publish_build.py select --selection dist/build-selection.json

      - name: Download selected build by artifact ID
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.build.outputs.artifact_id }}
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: dist/saved-build
          merge-multiple: true

      - name: Verify packages, create tag, and publish
        run: >-
          python3 scripts/publish_build.py publish
          --selection dist/build-selection.json
          --assets dist/saved-build
          --output dist/published-build
