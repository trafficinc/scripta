# Run from the repository root:
# scripta serve examples/web-proxy.scripta --config examples/observe-serve.toml
# The startup JSON events report the application and private health addresses.
# curl http://127.0.0.1:8080/
# curl http://127.0.0.1:9090/livez
# curl http://127.0.0.1:9090/readyz
# curl http://127.0.0.1:9090/metrics
host = "127.0.0.1"
port = 8080
workers = 2
log-format = "json"
health-address = "127.0.0.1:9090"
