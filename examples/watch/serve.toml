# Run from the repository root:
# scripta serve examples/watch/main.scripta --config examples/watch/serve.toml
# Edit message.inc or main.scripta, wait for reload_ready, then refresh.
host = "127.0.0.1"
port = 8080
workers = 2
watch = true
watch-debounce-ms = 200
log-format = "json"
health-address = "127.0.0.1:9090"
drain-timeout-ms = 1000
