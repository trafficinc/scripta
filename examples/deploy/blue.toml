# /etc/scripta/blue.toml; pair with scripta@blue.service.
host = "127.0.0.1"
port = 8080
workers = 2
queue = 32
log-format = "json"
health-address = "127.0.0.1:9090"
trusted-proxies = ["127.0.0.1/32"]
allowed-hosts = ["app.example.com"]
timeout-ms = 10000
drain-timeout-ms = 11000
session-dir = "/var/lib/scripta/sessions"
session-cookie-secure = true
upload-temp-dir = "/var/lib/scripta/blue/uploads"
